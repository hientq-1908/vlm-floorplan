[project]
name = "vlm-floorplan"
version = "0.1.0"
description = "VLM floorplan assistant: floorplan image to room graph, chat edits, graph output"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "shapely>=2.2.0",
]

[project.scripts]
vlm-floorplan = "vlm_floorplan.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
# Heavy ML stack (torch, transformers, TRL). Not needed for the schema,
# converters or viewer; install with `uv sync --group ml`.
ml = [
    "accelerate==1.16.0",
    "bitsandbytes==0.49.2",
    "clearml==2.2.0",
    "datasets>=4.7.0",
    "num2words==0.5.14",
    "peft==0.21.3",
    "pillow>=11.0.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.20.2",
    "trl==1.18.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are slow (Zenodo) and opt-in: `pytest -m network`.
addopts = "-ra --strict-markers -m 'not network and not gpu'"
markers = [
    "network: needs internet access (dataset servers)",
    "gpu: needs a 24 GB GPU and the full Qwen3.5-4B weights (about 9 GB download): opt-in, `pytest -m gpu`",
    "slow: takes more than a few seconds (a tiny-model training run on the CPU)",
    "hf: needs the ML group and the Qwen3.5-4B processor files (downloaded once from the Hugging Face Hub, then cached)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells hold long print lines and shell commands that read better unwrapped.
"*.ipynb" = ["E501"]


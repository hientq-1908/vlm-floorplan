[project]
name = "vlm-floorplan"
version = "0.0.1"
description = "VLM floorplan assistant: image to graph, chat edits, graph output"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
spike = [
    "accelerate==1.16.0",
    "clearml==2.2.0",
    "datasets>=4.7.0",
    "num2words==0.5.14",
    "peft==0.21.3",
    "pillow>=11.0.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.20.2",
    "trl==1.18.1",
]

[tool.uv]
default-groups = ["spike"]
